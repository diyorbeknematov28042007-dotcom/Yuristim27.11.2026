name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA from the approved Stage 03 branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yuristim-api-v3-staging
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Checkout trusted deployment policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: development/stage-03-backend-foundation
          persist-credentials: false

      - name: Validate commit and approved branch history
        id: authorize
        env:
          DEPLOY_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-deployment-ref.mjs

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://yuristim-api-v3-staging.diyorbeknematov28042007.workers.dev
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build

      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:staging

      - name: Deploy V3 staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_COMMIT_SHA: ${{ needs.authorize.outputs.sha }}
        run: pnpm --filter @yuristim/api exec wrangler deploy --config wrangler.jsonc --var "GIT_COMMIT_SHA:$GIT_COMMIT_SHA"
